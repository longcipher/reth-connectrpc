[package]
name = "base-common-consensus"
description = "Base alloy consensus types"

version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-shear]
ignored = ["alloy-sol-types", "proptest-arbitrary-interop"]

[features]
default = ["std"]
std = [
    "alloy-consensus/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "alloy-serde/std",
    "reth-codecs/std",
    "reth-primitives-traits/std",
    "reth-zstd-compressors/std",
    "serde/std",
    "thiserror/std",
]
k256 = ["alloy-consensus/k256", "alloy-primitives/k256"]
serde = [
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "bytes/serde",
    "reth-codecs/serde",
    "reth-primitives-traits/serde",
]
serde-bincode-compat = ["alloy-consensus/serde-bincode-compat"]
arbitrary = ["dep:arbitrary", "alloy-consensus/arbitrary"]
reth = ["k256", "serde", "serde-bincode-compat", "std"]

[dependencies]
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true, features = ["rlp"] }
alloy-rlp = { workspace = true }

thiserror = { workspace = true }

alloy-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_with = { version = "3" }

arbitrary = { workspace = true, optional = true }
bytes = { workspace = true }
modular-bitfield = { workspace = true }
reth-codecs = { workspace = true }
reth-db-api = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-zstd-compressors = { workspace = true }

[dev-dependencies]
alloy-consensus = { workspace = true, features = ["arbitrary"] }
alloy-signer = "2.1.1"
alloy-signer-local = "2.1.1"
alloy-sol-types.workspace = true
arbitrary = { workspace = true, features = ["derive"] }
proptest-arbitrary-interop = "0.1.0"
rand = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }
wincode = { workspace = true }

[lints]
workspace = true
