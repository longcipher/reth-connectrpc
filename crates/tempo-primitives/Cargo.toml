[package]
name = "tempo-primitives"
description = "Tempo primitive types"

version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-shear]
ignored = ["rand"]

[features]
default = ["std", "reth", "reth-codec", "serde"]
std = [
    "alloy-consensus/secp256k1",
    "alloy-consensus/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "alloy-serde?/std",
    "ed25519-consensus/std",
    "base64/std",
    "derive_more/std",
    "once_cell/std",
    "p256/std",
    "reth-ethereum-primitives?/std",
    "reth-primitives-traits?/std",
    "serde/std",
    "serde_json/std",
    "sha2/alloc",
    "tempo-contracts/std",
    "reth-codecs?/std",
]
reth = ["dep:reth-ethereum-primitives", "dep:reth-primitives-traits", "serde"]
serde = [
    "dep:alloy-serde",
    "alloy-consensus/serde",
    "reth-primitives-traits?/serde",
    "reth-ethereum-primitives?/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "reth-codecs?/serde",
    "p256/serde",
    "tempo-contracts/serde",
]
reth-codec = [
    "reth",
    "serde",
    "dep:reth-codecs",
    "dep:reth-db-api",
    "dep:modular-bitfield",
    "reth-ethereum-primitives/reth-codec",
    "reth-codecs/alloy",
    "reth-primitives-traits/reth-codec",
]
arbitrary = ["dep:arbitrary", "alloy-consensus/arbitrary"]

[dependencies]
tempo-contracts = { workspace = true }

reth-codecs = { workspace = true, optional = true }
reth-db-api = { workspace = true, optional = true }
reth-ethereum-primitives = { workspace = true, optional = true }
reth-primitives-traits = { workspace = true, optional = true }

alloy-consensus = { workspace = true, features = ["k256"] }
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
alloy-serde = { workspace = true, optional = true }

derive_more = { workspace = true }
modular-bitfield = { workspace = true, optional = true }
once_cell = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

arbitrary = { workspace = true, optional = true }
base64 = { workspace = true }
ed25519-consensus = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
sha2 = { workspace = true }

[dev-dependencies]
alloy-signer = "2.1.1"
alloy-signer-local = "2.1.1"
alloy-sol-types.workspace = true
arbitrary = { workspace = true, features = ["derive"] }
getrandom = "0.3"
proptest = { workspace = true }
proptest-arbitrary-interop = "0.1.0"
rand = { workspace = true }

[lints]
workspace = true
