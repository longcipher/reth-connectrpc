[workspace]
members = ["crates/*"]
exclude = [".github/"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/longcipher/reth-connectrpc"

[workspace.dependencies]
# local crates
base-common-consensus = { path = "crates/base-common-consensus", features = ["k256", "serde", "std", "reth"] }
tempo-contracts = { path = "crates/tempo-contracts" }
tempo-hardfork = { path = "crates/tempo-hardfork" }
tempo-primitives = { path = "crates/tempo-primitives", features = ["reth", "reth-codec"] }

# external crates
alloy-consensus = { version = "2.1.1", default-features = false, features = ["k256", "serde"] }
alloy-eips = { version = "2.1.1", default-features = false }
alloy-evm = { version = "0.37.1", default-features = false }
alloy-hardforks = "0.4.7"
alloy-primitives = { version = "1.6.1", default-features = false, features = ["rlp", "k256", "serde", "rand", "arbitrary"] }
alloy-provider = { version = "2.1.1", default-features = false }
alloy-rlp = { version = "0.3.16", default-features = false }
alloy-serde = { version = "2.1.1", default-features = false }
alloy-sol-types = { version = "1.6.1", default-features = false }
arbitrary = { version = "1", default-features = false }
async-stream = "0.3.6"
base64 = { version = "0.22.1", features = ["alloc"], default-features = false }
buffa = "0.8.1"
bytes = "1.12.1"
clap = "4.6.2"
config = "0.15.25"
connectrpc = "0.8.1"
connectrpc-build = "0.8.0"
connectrpc-reflection = "0.8.0"
derive_more = { version = "2.1.1", default-features = false }
ed25519-consensus = { version = "2.1.0", default-features = false }
eyre = "0.6.12"
futures-util = "0.3.32"
modular-bitfield = "0.13.1"
once_cell = { version = "1.21", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
paste = "1"
proptest = "1.11.0"
rand = "0.9"
reth-codecs = { version = "0.5.2", default-features = false, features = ["alloy"] }
reth-db-api = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384", default-features = false }
reth-execution-types = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384", default-features = false }
reth-exex = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384", default-features = false }
reth-primitives-traits = { version = "0.5.2", default-features = false }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", rev = "1bf2384", default-features = false }
reth-zstd-compressors = { version = "0.5.2", default-features = false }
rstest = "0.25"
serde = { version = "1.0.228", features = ["derive"], default-features = false }
serde_json = { version = "1.0.145", default-features = false }
serde_with = "3.21.0"
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["full"] }
tokio-stream = "0.1.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wincode = { version = "0.5.5", default-features = false, features = ["derive", "alloc"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
items_after_statements = "allow"
uninlined_format_args = "allow"
return_self_not_must_use = "allow"

cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
default_trait_access = "allow"
unused_async = "allow"
manual_let_else = "allow"
used_underscore_binding = "allow"
ref_option_ref = "allow"
ref_option = "allow"
format_push_string = "allow"
case_sensitive_file_extension_comparisons = "allow"
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
no_effect_underscore_binding = "allow"
redundant_closure_for_method_calls = "allow"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

allow_attributes = "allow"

result_large_err = "allow"

dbg_macro = "deny"

todo = "deny"
unimplemented = "deny"

print_stdout = "deny"
print_stderr = "deny"

borrow_as_ptr = "warn"
branches_sharing_code = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
derive_partial_eq_without_eq = "warn"
empty_line_after_doc_comments = "warn"
empty_line_after_outer_attr = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
if_not_else = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
iter_without_into_iter = "warn"
large_stack_frames = "warn"
manual_assert = "warn"
manual_clamp = "warn"
manual_is_variant_and = "warn"
manual_string_new = "warn"
missing_const_for_fn = "warn"
mutex_integer = "warn"
naive_bytecount = "warn"
needless_bitwise_bool = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
option_as_ref_cloned = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
redundant_else = "warn"
single_char_pattern = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_undefined_repr = "warn"
trivial_regex = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unnested_or_patterns = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
while_float = "warn"
zero_sized_map_values = "warn"

as_ptr_cast_mut = "allow"
cognitive_complexity = "allow"
debug_assert_with_mut_call = "allow"
fallible_impl_from = "allow"
future_not_send = "allow"
needless_collect = "allow"
non_send_fields_in_send_ty = "allow"
redundant_pub_crate = "allow"
significant_drop_in_scrutinee = "allow"
significant_drop_tightening = "allow"
too_long_first_doc_paragraph = "allow"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.rustdoc]
all = "warn"

[workspace.metadata.cargo-shear]
ignored = [
    "modular-bitfield",
    "clap",
    "config",
    "connectrpc-reflection",
    "cucumber",
    "eyre",
    "futures-util",
    "tokio-stream",
    "tracing-subscriber",
]

[patch.crates-io]
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", tag = "v0.5.2" }
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", tag = "v0.5.2" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", tag = "v0.5.2" }
reth-zstd-compressors = { git = "https://github.com/paradigmxyz/reth-core", tag = "v0.5.2" }

[profile.bench]
debug = true

[profile.dev]
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
